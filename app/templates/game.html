{% extends "base.html" %}
{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/game.css') }}">
{% endblock %}
{% block content %}
    <div class="game-banner">
        <img src="{{ url_for('static', path='images/' ~ game.banner_image) }}"/>
    </div>
    <div class="container">
        <div>
            <h2 class="game-title">{{ game.title }}</h2>
            <ul class="game-genres">
                {% for genre in game.genres %}
                <li class="genre">{{ genre.name }}</li>
                {% endfor %}
                <li class="genre">+</li>
            </ul>
            <p class="description">{{ game.description }}</p>
        </div>
        <form class="price-cart-container" action="{{ url_for('cart_add_game') }}" method="POST">
            <div class="price">{{ game.price }}</div>
            <input type="hidden" name="game_id" value="{{ game.id }}"/>
            <input type="submit" class="add-to-cart" value="Add to Cart"/>
        </form>
    </div>
{% endblock %}
