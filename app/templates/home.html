<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Store</title>
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet"> -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/fontawesome/css/all.min.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="topbar">
        <div class="navbar-home">
            <a class="signin-button" href="{{ url_for('login_page') }}">Sign In</a>
            <a href="{{ url_for('about_page') }}">About Us</a>
            <a href="#footer">Contact Us</a>
        </div>
        <a href="{{ url_for('home_page') }}"><img class="logo-topbar" src="{{ url_for('static', path='images/logo.svg') }}"/></a>
    </div>
    <div class="container">
        <h1>Orbit Games</h1>
        <p>Orbit Games is a digital gaming store made for gamers who want a simple, fast, and reliable way to discover and buy their favorite games.</p>
        <a href="{{ url_for('store_page') }}" class="img-container">
            <img src="{{ url_for('static', path='images/hollow-knight.png') }}">
            <img src="{{ url_for('static', path='images/bmw.png') }}">
            <img src="{{ url_for('static', path='images/hk-silksong.png') }}">
            <img src="{{ url_for('static', path='images/rdr2.png') }}">
            <img src="{{ url_for('static', path='images/dark-souls.png') }}">
        </a>
        <a class="cta-button" href="{{ url_for('store_page') }}">Shop Now <i class="fa-solid fa-cart-shopping"></i></a>
    </div>
    {% include "footer.html" %}
</body>
</html>
